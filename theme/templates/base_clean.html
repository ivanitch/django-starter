<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}{{ APP_NAME|default:"Django Starter" }}{% endblock %}</title>
    <script>
        const savedTheme = localStorage.getItem('theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
            document.documentElement.classList.add('dark');
            // Set attribute for DaisyUI
            document.documentElement.setAttribute('data-theme', 'dark');
        } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
        }
    </script>
    {% load static tailwind_tags %}
    {% tailwind_css %}
</head>
<body class="bg-base-100 text-base-content min-h-screen flex flex-col font-sans antialiased transition-colors duration-200">
<!-- Header -->
{% include "common/header.html" %}

<!-- Main content -->
<main class="flex-1 w-full flex flex-col">
    {% include "common/messages.html" %}
    {% block content %}
    {% endblock %}
</main>
<!-- Footer -->
{% include "common/footer.html" %}

<script src="{% static "js/main.js" %}"></script>
<script>
    const cleanThemeToggle = document.getElementById('theme-toggle-clean');
    if (cleanThemeToggle) {
        cleanThemeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
    }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
