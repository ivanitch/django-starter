{% load static %}
<header class="sticky top-0 z-50 bg-base-100/80 backdrop-blur-md border-b border-base-300">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
        <!-- Logo -->
        <a href="{% url 'main:home' %}" class="flex items-center gap-2 font-bold text-xl tracking-wide hover:opacity-80 transition-opacity">
            <div class="rounded-lg">🦋</div>
            <span class="text-base-content">Django</span>
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary">Starter</span>
        </a>

        <div class="flex items-center gap-4">
            <!-- Theme toggle button -->
            <button id="theme-toggle-clean"
                    class="btn btn-ghost btn-circle btn-sm text-base-content/70 hover:text-base-content">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
            </button>
            <a href="{{ REPO_LINK }}" target="_blank"
               class="hidden sm:inline-flex btn btn-outline btn-sm rounded-full font-medium">
                GitHub
            </a>
        </div>
    </div>
</header>
