[project]
name = "django-starter"
version = "0.1.0"
description = "Starter template for new Django projects, with ready-made infrastructure"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "django-tailwind>=4.5.0",
    "gunicorn>=26.2.0",
    "pillow>=12.3.0",
    "psycopg>=3.3.5",
    "django-environ>=0.14.0",
    "python-slugify>=9.0.0",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "django-tailwind[reload]>=4.5.0",
    "django-debug-toolbar>=8.0.0",
    "django-extensions>=4.1",
    "ipython>=9.17.1",
    "pytest-django>=4.14.0",
    "cookiecutter>=2.7.1",
]
