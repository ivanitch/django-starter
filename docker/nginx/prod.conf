# Docker internal DNS resolver to prevent 502 errors when 'web' container gets a new IP
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name django-starter.top www.django-starter.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS (uncomment when SSL is ready)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # Temporarily allow HTTP traffic until Certbot sets up certificates
    location / {
        set $django_upstream http://web:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
