<div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; color: #333333;">
    <h2 style="color: #4F46E5; margin-bottom: 20px;">Добро пожаловать в ProfiFlow!</h2>
    <p style="font-size: 16px; line-height: 1.5;">Hi <strong>{{ user.email }}</strong>,</p>
    <p style="font-size: 16px; line-height: 1.5; margin-bottom: 30px;">
        Please click the button below to confirm your registration and activate your account.
    </p>
    <a href="https://{{ domain }}{% url 'users:activate' uidb64=uid token=token %}"
       style="display: inline-block; padding: 12px 24px; background-color: #4F46E5; color: #ffffff; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 16px;">
        Activate Account
    </a>
    <p style="font-size: 14px; color: #999999; margin-top: 40px; border-top: 1px solid #eeeeee; padding-top: 20px;">
        If you think it's not you, then just ignore this email.
    </p>
</div>
